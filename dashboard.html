<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>דשבורד סרט</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=IBM+Plex+Mono:wght@400;500&family=Heebo:wght@400;500;600;700&family=Noto+Sans+Hebrew:wdth,wght@75,600&display=swap">
<style>
/* כותרות ב-Oswald ותוויות ב-IBM Plex Mono, מ-Escape from Vaslui. הטקסט ב-Heebo, כמו בצ'ק ליסט של One Table.
   ל-Oswald ול-Plex Mono אין אותיות עבריות, ולכן לכל אחד מהם יש שותף בעברית. */
:root{
  color-scheme:light;
  --bg:#fff; --ink:#000; --soft:#000; --faint:#6b6b6b;
  --edge:#d9d9d9; --edge-soft:#e8e8e8; --plate:#f2f2f2;
  --ok:#2F8A47; --ok-ink:#23683a;
  --f-head:Oswald,"Noto Sans Hebrew","Arial Narrow",sans-serif;
  --f-body:"Heebo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono","Heebo",ui-monospace,monospace;
  --bar-h:57px;
  --r:10px; --r-s:7px; --r-xs:5px;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--bar-h) + 16px);scrollbar-gutter:stable}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-head);font-weight:600;font-stretch:75%;margin:0;color:var(--ink)}
img{max-width:100%}
a{color:inherit}
button{font-family:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
body.wide main.wrap{max-width:1720px}
[hidden]{display:none!important}
bdi{unicode-bidi:isolate}

/* ---------- סרגל הטאבים ---------- */
.bar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--edge)}
.bar .wrap{display:flex;align-items:stretch;gap:24px;min-height:var(--bar-h)}
.brand{align-self:center;background:none;border:0;padding:0;cursor:pointer;font-family:var(--f-head);font-weight:600;font-stretch:75%;font-size:18px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-inline-start:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{font-family:var(--f-head);font-weight:600;font-stretch:75%;font-size:15px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;color:var(--faint);background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:0 16px;cursor:pointer;transition:color .15s,border-color .15s}
.tab:hover{color:var(--ink)}
a.tab{display:flex;align-items:center;text-decoration:none}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ---------- עמוד הבית ---------- */
.top{padding:64px 0 28px;border-bottom:1px solid var(--edge)}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 14px;color:var(--faint)}
.top h1{font-size:clamp(40px,7vw,68px);line-height:1.02;letter-spacing:.005em;text-transform:uppercase;margin:0 0 16px;text-wrap:balance}
.lede{max-width:64ch;font-size:17px;margin:0}
.tiles{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin:36px 0 72px}
.tile{display:flex;flex-direction:column;gap:8px;text-align:start;background:#fff;border:1px solid var(--edge);border-radius:var(--r);padding:20px 20px 18px;cursor:pointer;transition:border-color .15s}
.tile:hover{border-color:var(--ink)}
a.tile{text-decoration:none;line-height:normal}
.tile .i{font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.tile h2{font-size:26px;line-height:1.15;letter-spacing:.02em;text-transform:uppercase}
.tile p{margin:0;font-size:15px}
.tile .stat{margin-top:auto;padding-top:12px;border-top:1px solid var(--edge-soft);font-family:var(--f-mono);font-size:12px;color:var(--faint)}

/* ---------- כותרת של כל טאב וכל סעיף ---------- */
section{padding-top:48px}
.shead{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.shead h2{font-size:clamp(26px,3.4vw,34px);letter-spacing:.02em;text-transform:uppercase}
.count{font-family:var(--f-mono);font-size:12px;color:var(--faint);letter-spacing:.04em}
.rule{height:3px;margin:0 0 22px;background:linear-gradient(270deg,#000 0 62px,var(--edge) 62px)}
.sintro{max-width:72ch;font-size:16px;margin:0 0 24px}
.pane{padding-bottom:72px}

/* ---------- מקום לתמונה שעוד אין ---------- */
.noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:11px;color:var(--faint);letter-spacing:.04em}

/* ---------- רואים שומעים (מהטיוטה של One Table) ---------- */
.btn{font:600 13.5px var(--f-body);border-radius:var(--r-s);padding:8px 15px;cursor:pointer;border:1px solid var(--edge);background:#fff}
.btn:hover{border-color:#000}
.btn.pri{background:#000;border-color:#000;color:#fff}
.btn[aria-pressed="true"]{background:#000;border-color:#000;color:#fff}
.note{font-size:15px;border:1px dashed var(--edge);border-radius:var(--r);padding:10px 12px;margin:0 0 14px}
.tw{border:1px solid var(--edge);border-radius:var(--r);background:#fff}
#seehear table{width:100%;border-collapse:separate;border-spacing:0;min-width:1100px}
#seehear th{position:sticky;top:var(--bar-h);z-index:5;background:#fff;font-family:var(--f-head);font-weight:600;font-stretch:75%;font-size:15px;letter-spacing:.03em;text-align:start;padding:11px 12px;border-bottom:2px solid #000}
#seehear th:first-child{border-start-start-radius:var(--r)}
#seehear th:last-child{border-start-end-radius:var(--r)}
#seehear td{padding:12px;border-bottom:1px solid var(--edge-soft);vertical-align:top;font-size:15.5px;line-height:1.65}
#seehear tr:last-child td{border-bottom:0}
#seehear td.n{font-family:var(--f-head);font-weight:600;font-stretch:75%;font-size:19px;width:44px}
#seehear td[data-k="time"]{white-space:nowrap;font-family:var(--f-mono);font-size:12.5px;width:120px}
#seehear td[data-k="title"]{font-family:var(--f-head);font-weight:600;font-stretch:75%;font-size:16px;letter-spacing:.02em;width:130px}
#seehear td.en{direction:ltr;text-align:left}
#seehear td.notes{min-width:170px;font-size:14.5px}
#seehear td.notes:empty::before{content:"—";color:var(--faint)}
#seehear td.dn,#seehear th.dn{width:60px;text-align:center}
#seehear tr.gap td{padding:0;background:#fafafa;text-align:center;height:22px;opacity:1}
#seehear tr.gap span{display:inline-block;font-family:var(--f-mono);font-size:11.5px;background:#fff;border:1px solid var(--edge);border-radius:var(--r-xs);padding:0 9px;transform:translateY(-1px)}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
td.open .clamp{display:block;-webkit-line-clamp:unset}
.more{display:inline-block;margin-top:6px;border:1px solid var(--edge);border-radius:var(--r-xs);padding:2px 9px;background:#fff;font:600 12px var(--f-body);cursor:pointer}
.more:hover{border-color:#000}
/* ---------- צ'ק בוקס, משותף לטבלה ולתיקונים ---------- */
.ck{flex:none;width:28px;height:28px;border-radius:var(--r-s);border:1.5px solid #bdbdbd;background:#fff;cursor:pointer;font-size:17px;line-height:1;color:#fff;padding:0}
.ck:hover{border-color:#000}
.ck[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.ck[aria-pressed="true"]::after{content:"✓"}

/* ---------- תיקונים ---------- */
.rounds{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
.round{display:flex;align-items:baseline;gap:9px;background:#fff;border:1px solid var(--edge);border-radius:var(--r-s);padding:8px 13px;cursor:pointer}
.round:hover{border-color:#000}
.round b{font-family:var(--f-head);font-weight:600;font-stretch:75%;font-size:15px;letter-spacing:.02em}
.round span{font-family:var(--f-mono);font-size:11.5px;color:var(--faint)}
.round[aria-pressed="true"]{background:#000;border-color:#000;color:#fff}
.round[aria-pressed="true"] span{color:#d4d4d4}
.fx-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 16px}
.fx-track{flex:1;min-width:140px;height:6px;border-radius:3px;background:var(--edge-soft);overflow:hidden}
.fx-track i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}
.fx-ch{border:1px solid var(--edge);border-radius:var(--r);padding:16px 18px 6px;margin:0 0 14px}
.fx-ch.alldone{border-color:#b6cdb9}
.fx-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:9px;margin:0 0 6px}
.fx-head .n,.fx-head h3{font-family:var(--f-head);font-weight:600;font-stretch:75%;font-size:20px;letter-spacing:.02em}
.fx-head .sc{font-family:var(--f-mono);font-size:12px;color:var(--faint)}
.fx-head .cnt{margin-inline-start:auto;font-family:var(--f-mono);font-size:12.5px;color:var(--faint)}
.fx-ch.alldone .cnt{color:var(--ok-ink)}
.fx-ch ul{list-style:none;margin:0;padding:0}
.fx-ch li{display:flex;gap:12px;align-items:flex-start;border-top:1px solid var(--edge-soft);padding:11px 0}
.tx{flex:1;min-width:0;font-size:16px;line-height:1.6}
.fx-ch li.done .tx{color:var(--faint);text-decoration:line-through}
.tag{display:inline-block;font-family:var(--f-mono);font-size:11px;border:1px solid var(--edge);border-radius:var(--r-xs);padding:0 6px;margin-inline-end:6px;text-decoration:none}
a.ts{font-family:var(--f-mono);font-size:12px;color:var(--faint);white-space:nowrap;direction:ltr;unicode-bidi:isolate}
a.ts:hover{color:#000}
.onlyopen .fx-ch li.done,.onlyopen .fx-ch.alldone{display:none}
.fx-open{border:1px solid #000;border-radius:var(--r);padding:16px 18px;margin:22px 0 0}
.fx-open h3{font-size:18px;letter-spacing:.02em;margin:0 0 6px}
.fx-open ul{margin:0;padding-inline-start:20px}
.fx-open li{padding:3px 0;font-size:15.5px}

/* ---------- דמויות, לוקיישנים ורפרנסים (מהקאסט של Vaslui) ---------- */
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(238px,1fr))}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.card{background:#fff;border:1px solid var(--edge);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.frame{display:block;background:var(--plate);aspect-ratio:3/4;overflow:hidden}
.frame.w{aspect-ratio:16/9}
.frame img{width:100%;height:100%;object-fit:contain;object-position:center top;display:block}
.plate{padding:14px 15px 15px;display:flex;flex-direction:column;gap:7px;flex:1}
.namerow{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.plate h3{font-size:22px;letter-spacing:.03em;line-height:1.1;text-transform:uppercase}
.flag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;padding:2px 7px;border-radius:var(--r-xs);background:#fff;color:#000;border:1px solid #000}
.flag.pending{color:var(--faint);border:1px dashed var(--faint)}
.role{margin:0;font-size:14.5px;font-weight:600}
.tell{margin:0;font-size:15px}
.tell.clamp{-webkit-line-clamp:2}
.tell-more{align-self:flex-start;padding:0;border:0;background:none;font-size:12px;text-decoration:underline;cursor:pointer}
.path{margin:auto 0 0;padding-top:10px;border-top:1px solid var(--edge-soft);font-family:var(--f-mono);font-size:11px;color:var(--faint);word-break:break-all;direction:ltr;text-align:left}
.carousel-viewport{position:relative}
.cslide{display:none;width:100%;height:100%}
.cslide.active{display:block}
.carousel-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.55);color:#fff;border:none;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;z-index:2}
.carousel-nav:hover{background:rgba(0,0,0,.8)}
.carousel-prev{right:8px}
.carousel-next{left:8px}
.carousel-dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:2}
.carousel-dots .dot{width:7px;height:7px;border-radius:50%;background:rgba(0,0,0,.25);cursor:pointer;border:none;padding:0}
.carousel-dots .dot.active{background:#000}
.llb{position:fixed;inset:0;z-index:9999;background:rgba(8,9,12,.92);display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.llb img{max-width:96vw;max-height:94vh;object-fit:contain}
.llb button{position:absolute;top:12px;left:14px;background:none;border:0;color:#fff;font-size:30px;line-height:1;cursor:pointer}

/* ל-Plex Mono יש רווח רחב שנועד לאנגלית, ובעברית הוא נפתח יותר מדי. */
.eyebrow,.count,.prog,.tile .stat,.round span,.tag,.flag,.noimg{word-spacing:-.32em}

footer{margin-top:0;padding:22px 0 40px;border-top:1px solid var(--edge);font-size:13px;color:var(--faint)}

@media (max-width:1180px){.tw{overflow-x:auto}#seehear th{top:0}}
@media (max-width:760px){
  .bar .wrap{flex-direction:column;gap:0;padding-top:10px}
  .brand{align-self:flex-start}
  .tabs{margin-inline-start:0;min-height:42px}
  .tab{padding:0 12px 0 0}
  :root{--bar-h:88px}
}
@media (max-width:560px){.grid{grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px}.grid.wide{grid-template-columns:1fr}.top{padding-top:40px}}
</style>
</head>

<script>
/* ==========================================================================

   הזה, ולא נוגעים בשאר. התוכן למטה הוא דוגמה בלבד.

   id        מזהה קצר וייחודי לפרויקט. הסימונים והעריכות נשמרים בדפדפן לפי המזהה.

   ready/done סימון התחלתי של "מוכן" ו"בוצע". סימון בדפדפן גובר עליו.

   סבב תיקונים חדש = עוד אובייקט ב-rounds. הסבב האחרון נפתח ראשון.

<header class="bar"><div class="wrap">

</div></header>

<main class="wrap">

  <div class="pane" id="p-seehear" role="tabpanel" hidden></div>

  <div class="pane" id="p-elements" role="tabpanel" hidden></div>
  <footer id="foot"></footer>
</main>

<script>
(function () {
  var P = PROJECT;
  document.title = P.title + ' · דשבורד';

  /* ---------- עזרים ---------- */
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return [].slice.call((r || document).querySelectorAll(s)); }
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function txt(h) { var d = document.createElement('div'); d.innerHTML = h || ''; return (d.innerText || d.textContent).replace(/\s+/g, ' ').trim(); }
  function key(k) { return 'dash-' + P.id + '-' + k; }
  function getJ(k, d) { try { return JSON.parse(localStorage.getItem(key(k)) || 'null') || d; } catch (e) { return d; } }
  function setJ(k, v) { try { localStorage.setItem(key(k), JSON.stringify(v)); return true; } catch (e) { return false; } }
  function shead(title, count) { return '<div class="shead"><h2>' + esc(title) + '</h2><span class="count">' + esc(count) + '</span></div><div class="rule"></div>'; }
  function mmss(s) { var m = Math.floor(s / 60), r = s % 60; return m + ':' + (r < 10 ? '0' : '') + r; }

  var TABS = [
    { id: 'home', label: 'בית' },
    { id: 'seehear', label: 'רואים שומעים', desc: 'הטבלה של הסרט: מה רואים, קריינות והערות לכל סצנה.' },
    { id: 'fixes', label: 'תיקונים', desc: 'צ׳ק ליסט תיקונים, מסודר לפי סבבים.' },
    { id: 'elements', label: P.elements.label, desc: 'כל מה שהסרט בנוי ממנו, עם התמונות המאושרות.' },
  ];

  /* ---------- טאבים ---------- */
  var tabsEl = $('#tabs');
  tabsEl.innerHTML = TABS.map(function (t) {
    return '<button type="button" class="tab" role="tab" data-tab="' + t.id + '" aria-controls="p-' + t.id + '" aria-selected="false">' + esc(t.label) + '</button>' +
      (t.id === 'home' && P.scriptFile ? '<a class="tab" href="' + esc(P.scriptFile.path) + '" target="_blank" rel="noopener">תסריט</a>' : '');
  }).join('');
  function show(id, anchor, keepHash) {
    if (!TABS.some(function (t) { return t.id === id; })) id = 'home';
    TABS.forEach(function (t) { $('#p-' + t.id).hidden = t.id !== id; });
    $$('.tab[data-tab]').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.tab === id ? 'true' : 'false'); });
    document.body.classList.toggle('wide', id === 'seehear');
    if (!keepHash) history.replaceState(null, '', '#' + id + (anchor ? '/' + anchor : ''));
    if (id === 'seehear') clampSetup();
    var el = anchor && document.getElementById(anchor);
    if (el) el.scrollIntoView(); else window.scrollTo(0, 0);
    var active = $('.tab[aria-selected="true"]');
    if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }
  tabsEl.addEventListener('click', function (e) { var b = e.target.closest('.tab[data-tab]'); if (b) show(b.dataset.tab); });
  tabsEl.addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    var ids = TABS.map(function (t) { return t.id; }), cur = ids.indexOf($('.tab[aria-selected="true"]').dataset.tab);
    var next = ids[(cur + (e.key === 'ArrowLeft' ? 1 : ids.length - 1)) % ids.length];
    e.preventDefault(); show(next); $('.tab[data-tab="' + next + '"]').focus();
  });
  var brand = $('#brand'); brand.textContent = P.title; brand.addEventListener('click', function () { show('home'); });
  $('#foot').textContent = P.title + ' · TodoAI Studio';

  /* ---------- בית ---------- */
  function renderHome() {
    var SF = P.scriptFile, first = SF ? 2 : 1;
    var fileTile = SF ? '<a class="tile" href="' + esc(SF.path) + '" target="_blank" rel="noopener"><span class="i">01</span><h2>תסריט</h2><p>' + esc(SF.desc) + '</p><span class="stat">' + esc(SF.stat) + '</span></a>' : '';
    var tiles = fileTile + TABS.slice(1).map(function (t, i) {
      return '<button type="button" class="tile" data-go="' + t.id + '"><span class="i">0' + (i + first) + '</span><h2>' + esc(t.label) + '</h2><p>' + esc(t.desc) + '</p><span class="stat" data-stat="' + t.id + '"></span></button>';
    }).join('');
    $('#p-home').innerHTML = '<header class="top"><p class="eyebrow">' + esc(P.eyebrow) + '</p><h1>' + esc(P.title) + '</h1><p class="lede">' + esc(P.lede) + '</p></header><div class="tiles">' + tiles + '</div>';
    $('#p-home').addEventListener('click', function (e) { var b = e.target.closest('[data-go]'); if (b) show(b.dataset.go); });
  }
  function stats() {
    var set = function (id, v) { var el = $('[data-stat="' + id + '"]'); if (el) el.textContent = v; };
    var d = doneScenes(), c = P.seeHear.scenes.filter(function (s) { return d[s.id]; }).length;
    set('seehear', 'מוכנות ' + c + ' מתוך ' + P.seeHear.scenes.length + ' סצנות');
    var all = 0, did = 0; P.rounds.forEach(function (r) { var x = roundCount(r); all += x[1]; did += x[0]; });
    set('fixes', P.rounds.length + ' סבבים · בוצעו ' + did + ' מתוך ' + all);
    set('elements', P.elements.sections.map(function (s) { return s.cards.length + ' ' + s.title; }).join(' · '));
  }

  /* ---------- תמונה ---------- */
  function picture(src, alt, cls) {
    if (!src) return '<span class="' + cls + '"><span class="noimg">תמונה</span></span>';
    return '<a class="' + cls + '" href="' + esc(src) + '" data-lb><img loading="lazy" src="' + esc(src) + '" alt="' + esc(alt) + '"></a>';
  }
  /* ---------- רואים שומעים ---------- */
  var SH = P.seeHear, DKEY = 'seehear-done';
  var openSet = {}, shEl;
  function doneScenes() {
    var saved = getJ(DKEY, null); if (saved) return saved;
    var o = {}; SH.scenes.forEach(function (s) { if (s.ready) o[s.id] = 1; }); return o;
  }
  function renderSeeHear() {
    var span = 4 + SH.columns.length, rows = '';
    SH.scenes.forEach(function (s, i) {
      rows += '<tr data-id="' + esc(s.id) + '"><td class="dn"><button type="button" class="ck" aria-pressed="false" aria-label="סמן כמוכן"></button></td>' +
        '<td class="n">' + esc(s.id) + '</td><td data-k="time">' + (s.time || '') + '</td><td data-k="title">' + (s.title || '') + '</td>' +
        SH.columns.map(function (c) {
          return '<td data-k="' + c.k + '"' + (c.en ? ' dir="ltr" class="en"' : c.notes ? ' class="notes"' : '') + '>' + (s[c.k] || '') + '</td>';
        }).join('') + '</tr>';
      if (s.gap && i < SH.scenes.length - 1) rows += '<tr class="gap" aria-hidden="true"><td colspan="' + span + '"><span>' + esc(s.gap) + '</span></td></tr>';
    });
    $('#p-seehear').innerHTML = '<section id="seehear">' + shead('רואים שומעים', SH.scenes.length + ' סצנות') + '<p class="sintro">' + SH.intro + '</p>' +
      '<div class="tw"><table><thead><tr><th class="dn">מוכן</th><th>#</th><th>' + esc(SH.timeLabel) + '</th><th>' + esc(SH.titleLabel) + '</th>' +
      SH.columns.map(function (c) { return '<th>' + esc(c.label) + '</th>'; }).join('') + '</tr></thead><tbody>' + rows + '</tbody></table></div></section>';
    shEl = $('#seehear');
    $$('.ck', shEl).forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.closest('tr').dataset.id, d = doneScenes(), on = !d[id];
        if (on) d[id] = Date.now(); else delete d[id];
        setJ(DKEY, d);
        paintDone(); stats();
      });
    });
    paintDone();
    var t; function rz() { clearTimeout(t); t = setTimeout(clampSetup, 120); }
    window.addEventListener('resize', rz);
  }
  function cellKey(td) { return td.closest('tr').dataset.id + '.' + td.dataset.k; }
  function clampSetup() {
    if (!shEl || shEl.closest('[hidden]')) return;
    SH.columns.forEach(function (col) {
      $$('td[data-k="' + col.k + '"]', shEl).forEach(function (td) {
        var k = cellKey(td), c = $('.clamp', td), b = $('.more', td);
        if (!td.textContent.trim()) { if (b) b.remove(); return; }
        if (!c) { c = document.createElement('span'); c.className = 'clamp'; while (td.firstChild) c.appendChild(td.firstChild); td.appendChild(c); }
        td.classList.remove('open');
        var needs = c.scrollHeight > c.clientHeight + 2;
        if (openSet[k]) { td.classList.add('open'); needs = true; }
        if (!needs) { if (b) b.remove(); return; }
        if (!b) {
          b = document.createElement('button'); b.type = 'button'; b.className = 'more';
          b.addEventListener('click', function (ev) {
            ev.preventDefault(); ev.stopPropagation();
            openSet[k] = !openSet[k]; td.classList.toggle('open', !!openSet[k]); moreLabel(b, openSet[k], col.en);
          });
          td.appendChild(b);
        }
        b.hidden = false; moreLabel(b, !!openSet[k], col.en);
      });
    });
  }
  function moreLabel(b, open, en) { b.textContent = open ? (en ? 'Show less' : 'הצג פחות') : (en ? 'Show more' : 'הצג עוד'); }
  function paintDone() {
    var d = doneScenes(), rows = $$('tbody tr[data-id]', shEl);
    rows.forEach(function (tr) { var on = !!d[tr.dataset.id]; tr.classList.toggle('done', on); $('.ck', tr).setAttribute('aria-pressed', on ? 'true' : 'false'); });
  }
  /* ---------- תיקונים ---------- */
  var FKEY = 'fixes-done', RKEY = 'fixes-round';
  function fixDone() { return getJ(FKEY, {}); }
  function isDone(r, it, d) { var k = r.id + '.' + it.id; return k in d ? !!d[k] : !!it.done; }
  function roundCount(r) {
    var d = fixDone(), done = 0, all = 0;
    r.groups.forEach(function (g) { g.items.forEach(function (it) { all++; if (isDone(r, it, d)) done++; }); });
    return [done, all];
  }
  function currentRound() {
    var id = getJ(RKEY, null), r = P.rounds.filter(function (x) { return x.id === id; })[0];
    return r || P.rounds[P.rounds.length - 1];
  }
  function renderFixes() {
    $('#p-fixes').innerHTML = '<section id="fixes">' + shead('תיקונים', P.rounds.length + ' סבבים') + '<div class="rounds" id="rounds"></div><div id="round-body"></div></section>';
    $('#rounds').addEventListener('click', function (e) { var b = e.target.closest('.round'); if (b) { setJ(RKEY, b.dataset.r); drawRound(); } });
    drawRound();
  }
  function drawRounds() {
    var cur = currentRound();
    $('#rounds').innerHTML = P.rounds.map(function (r) {
      var c = roundCount(r);
      return '<button type="button" class="round" data-r="' + esc(r.id) + '" aria-pressed="' + (r.id === cur.id) + '"><b>' + esc(r.title) + '</b><span>' + esc(r.date) + ' · ' + c[0] + '/' + c[1] + '</span></button>';
    }).join('');
  }
  function drawRound() {
    drawRounds();
    var r = currentRound(), link = r.source ? esc(r.source) + (r.date ? ', ' + esc(r.date) : '') + '. ' : '';
    $('#round-body').innerHTML = '<p class="sintro">' + link + 'מסמנים כל מטלה שהסתיימה.</p>' +
      '<div class="fx-bar"><span class="prog" id="fx-prog"></span><span class="fx-track"><i id="fx-fill"></i></span><button type="button" class="btn" id="fx-open" aria-pressed="false">רק מה שפתוח</button></div>' +
      (r.note ? '<p class="note">' + r.note + '</p>' : '') + '<div id="fx-list">' + r.groups.map(function (g) {
        return '<div class="fx-ch"><div class="fx-head"><span class="n">' + esc(g.n) + '</span><h3>' + esc(g.title) + '</h3>' + (g.sc ? '<span class="sc">' + esc(g.sc) + '</span>' : '') + '<span class="cnt"></span></div><ul>' + g.items.map(function (it) {
          var ts = it.ts != null ? (r.recording ? ' <a class="ts" target="_blank" rel="noopener" href="' + esc(r.recording + it.ts) + '">' + mmss(it.ts) + '</a>' : ' <span class="ts">' + mmss(it.ts) + '</span>') : '';
          return '<li data-id="' + esc(it.id) + '"><button type="button" class="ck" aria-pressed="false" aria-label="סמן כבוצע"></button><div class="tx">' + (it.tag ? '<span class="tag">' + esc(it.tag) + '</span>' : '') + it.text + ts + '</div></li>';
        }).join('') + '</ul></div>';
      }).join('') + '</div>' + (r.open && r.open.length ? '<div class="fx-open"><h3>פתוח להחלטה</h3><ul>' + r.open.map(function (o) { return '<li>' + o + '</li>'; }).join('') + '</ul></div>' : '');
    $('#fx-list').addEventListener('click', function (e) {
      var b = e.target.closest('.ck'); if (!b) return;
      var id = b.closest('li').dataset.id, it = null;
      r.groups.forEach(function (g) { g.items.forEach(function (x) { if (x.id === id) it = x; }); });
      var d = fixDone(); d[r.id + '.' + id] = !isDone(r, it, d); setJ(FKEY, d); paintRound(); drawRounds(); stats();
    });
    var ob = $('#fx-open');
    ob.addEventListener('click', function () { var on = ob.getAttribute('aria-pressed') !== 'true'; ob.setAttribute('aria-pressed', on); $('#round-body').classList.toggle('onlyopen', on); });
    paintRound();
  }
  function paintRound() {
    var r = currentRound(), d = fixDone(), done = 0, all = 0;
    $$('#fx-list .fx-ch').forEach(function (box, gi) {
      var items = r.groups[gi].items, c = 0;
      $$('li', box).forEach(function (li, i) {
        var on = isDone(r, items[i], d); if (on) c++;
        li.classList.toggle('done', on); $('.ck', li).setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      all += items.length; done += c;
      box.classList.toggle('alldone', c === items.length);
      $('.cnt', box).textContent = c + ' / ' + items.length;
    });
    $('#fx-prog').textContent = 'בוצעו: ' + done + ' מתוך ' + all;
    $('#fx-fill').style.width = (all ? Math.round(done / all * 100) : 0) + '%';
  }

  /* ---------- דמויות, לוקיישנים ורפרנסים ---------- */
  function cardFrame(c, wide) {
    var cls = 'frame' + (wide ? ' w' : ''), imgs = c.images || [];
    if (imgs.length < 2) return picture(imgs[0], c.name, cls);
    return '<div class="' + cls + ' carousel-viewport" data-carousel>' + imgs.map(function (src, i) {
      return '<a class="cslide' + (i ? '' : ' active') + '" href="' + esc(src) + '" data-lb><img loading="lazy" src="' + esc(src) + '" alt="' + esc(c.name) + '"></a>';
    }).join('') + '<button type="button" class="carousel-nav carousel-prev" aria-label="התמונה הקודמת">›</button><button type="button" class="carousel-nav carousel-next" aria-label="התמונה הבאה">‹</button>' +
      '<div class="carousel-dots">' + imgs.map(function (_, i) { return '<button type="button" class="dot' + (i ? '' : ' active') + '" aria-label="תמונה ' + (i + 1) + '"></button>'; }).join('') + '</div></div>';
  }
  function renderElements() {
    $('#p-elements').innerHTML = P.elements.sections.map(function (s) {
      return '<section id="' + esc(s.id) + '">' + shead(s.title, s.cards.length + ' פריטים') + (s.intro ? '<p class="sintro">' + s.intro + '</p>' : '') +
        '<div class="grid' + (s.wide ? ' wide' : '') + '">' + s.cards.map(function (c) {
          return '<article class="card">' + cardFrame(c, s.wide) + '<div class="plate"><div class="namerow"><h3>' + esc(c.name) + '</h3>' +
            (c.flag ? '<span class="flag' + (c.pending ? ' pending' : '') + '">' + esc(c.flag) + '</span>' : '') + '</div>' +
            (c.role ? '<p class="role">' + esc(c.role) + '</p>' : '') + (c.text ? '<p class="tell">' + c.text + '</p>' : '') +
            (c.path ? '<p class="path">' + esc(c.path) + '</p>' : '') + '</div></article>';
        }).join('') + '</div></section>';
    }).join('');
    $$('[data-carousel]').forEach(function (car) {
      var slides = $$('.cslide', car), dots = $$('.dot', car), idx = 0;
      function go(i) { idx = (i + slides.length) % slides.length; slides.forEach(function (s, j) { s.classList.toggle('active', j === idx); }); dots.forEach(function (d, j) { d.classList.toggle('active', j === idx); }); }
      $('.carousel-prev', car).addEventListener('click', function (e) { e.preventDefault(); go(idx - 1); });
      $('.carousel-next', car).addEventListener('click', function (e) { e.preventDefault(); go(idx + 1); });
      dots.forEach(function (d, j) { d.addEventListener('click', function (e) { e.preventDefault(); go(j); }); });
    });
    $$('.card .tell').forEach(function (t) {
      if (t.textContent.trim().length < 90) return;
      t.classList.add('clamp');
      var b = document.createElement('button'); b.type = 'button'; b.className = 'tell-more'; b.textContent = 'קרא עוד';
      b.addEventListener('click', function () { var open = t.classList.toggle('clamp') === false; b.textContent = open ? 'הצג פחות' : 'קרא עוד'; });
      t.insertAdjacentElement('afterend', b);
    });
  }

  /* ---------- תמונה במסך מלא ---------- */
  var box = document.createElement('div'); box.className = 'llb'; box.hidden = true;
  box.innerHTML = '<img alt=""><button type="button" aria-label="סגירה">×</button>'; document.body.appendChild(box);
  function closeBox() { box.hidden = true; $('img', box).removeAttribute('src'); }
  box.addEventListener('click', closeBox);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeBox(); });
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[data-lb]'); if (!a) return;
    e.preventDefault(); $('img', box).src = a.getAttribute('href'); box.hidden = false;
  });

  /* ---------- הפעלה ---------- */
